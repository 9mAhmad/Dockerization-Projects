
services:
  backend_chatapp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/chatapp
      - JWT_SECRET=secret
      - NODE_ENV=development
    networks:
      - app_network

  frontend_chatpp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001


  mongodb:
    image: mongodb/mongodb-community-server:8.3-ubi8-slim
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - db_data:/var/lib/mongodb
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge

    